bookdown::bs4_book:
  css: style.css
  theme:
    primary: "#096B72"
  repo: https://github.com/rstudio/bookdown-demo
  mathjax: "default"
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: tinytex 
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
bookdown::word_document2:
    keep_md: yes
    reference_docx: style_reference.docx